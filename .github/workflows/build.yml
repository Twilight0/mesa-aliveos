name: Build and Release mesa-aliveos

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arch:
    name: Build Arch Linux Package
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pacman Mirrors & Builder User
        run: |
          pacman-key --init
          pacman-key --populate archlinux

          cat << 'EOF' > /tmp/mirrorlist.new
          Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
          Server = https://fastly.mirror.pkgbuild.com/$repo/os/$arch
          Server = https://mirrors.kernel.org/archlinux/$repo/os/$arch
          Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/mirrorlist.new
          cat /etc/pacman.d/mirrorlist >> /tmp/mirrorlist.new 2>/dev/null || true
          mv /tmp/mirrorlist.new /etc/pacman.d/mirrorlist

          pacman -Syu --noconfirm git
          useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build Package with makepkg
        run: |
          sudo -u builder env MAKEFLAGS="-j$(nproc)" makepkg --syncdeps --noconfirm --nocheck --clean

      - name: Verify Package Contents
        run: |
          shopt -s nullglob
          pkgs=(mesa-aliveos-*.pkg.tar.zst)
          if [ "${#pkgs[@]}" -ne 1 ]; then
            echo "Expected exactly 1 package archive, found ${#pkgs[@]}: ${pkgs[*]}" >&2
            exit 1
          fi
          pkg="${pkgs[0]}"
          echo "Built package: $pkg"

          filelist="$(pacman -Qlp "$pkg")"
          required=(
            "usr/lib/libEGL_mesa.so"
            "usr/lib/libGLX_mesa.so"
            "usr/lib/libGLX_indirect.so.0"
            "usr/lib/libgbm.so"
            "usr/lib/dri/nouveau_dri.so"
            "usr/lib/dri/nouveau_drv_video.so"
            "usr/lib/dri/radeonsi_dri.so"
            "usr/lib/dri/iris_dri.so"
            "usr/lib/dri/crocus_dri.so"
            "usr/lib/dri/swrast_dri.so"
            "usr/share/glvnd/egl_vendor.d/50_mesa.json"
            "usr/share/licenses/mesa-aliveos/license.rst"
          )
          for entry in "${required[@]}"; do
            if ! grep -q "$entry" <<< "$filelist"; then
              echo "Missing expected file in package: $entry" >&2
              exit 1
            fi
          done

          forbidden=(
            "00-radv-defaults.conf"
            "01-radv-performance.conf"
          )
          for entry in "${forbidden[@]}"; do
            if grep -q "$entry" <<< "$filelist"; then
              echo "Unexpected file conflicting with vulkan-radeon: $entry" >&2
              exit 1
            fi
          done

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesa-aliveos-arch-pkg
          path: mesa-aliveos-*.pkg.tar.zst

  release:
    name: Publish GitHub Release
    needs: [build-arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Built Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: mesa-aliveos-arch-pkg
          path: release-assets

      - name: Generate Checksums & Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (
            cd release-assets
            sha256sum *.pkg.tar.zst > SHA256SUMS.txt
          )

          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            pkgver="$(grep -E '^pkgver=' PKGBUILD | cut -d= -f2 | tr -d "'\"")"
            pkgrel="$(grep -E '^pkgrel=' PKGBUILD | cut -d= -f2 | tr -d "'\"")"
            TAG="v${pkgver}-${pkgrel}"
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "mesa-aliveos $TAG" \
              --notes "Prebuilt Arch Linux / AliveOS package for mesa-aliveos $TAG. See CHANGELOG.md for details." \
              --latest
          fi

          gh release upload "$TAG" release-assets/*.pkg.tar.zst release-assets/SHA256SUMS.txt --clobber
